name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Check switch settings
        run: |
          # ENABLE_ の設定値が小文字の true / false 以外ならデプロイを止める
          if grep -E '^const ENABLE_[A-Z_]+ = ' script.js | grep -vE '= (true|false);'; then
            echo "script.js の ENABLE_ の値は小文字の true / false で書いてください"
            exit 1
          fi
          node --check script.js

      - name: Inject GAS URL
        env:
          GAS_URL: ${{ vars.GAS_URL }}
        run: |
          if [ -z "$GAS_URL" ]; then
            echo "GAS_URL がリポジトリ変数に設定されていません"
            exit 1
          fi
          envsubst '$GAS_URL' < script.js > script.js.tmp
          mv script.js.tmp script.js
          sed -i "s/?v=4/?v=${{ github.sha }}/g" index.html
          if grep -q '\$GAS_URL' script.js; then
            echo "プレースホルダーが残っています"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
