name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイの競合を防ぐ設定
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # リポジトリのVariables（vars.LIFF_ID / vars.GAS_URL）を取得して置換
      - name: Replace Environment Variables
        run: |
          sed -i 's@\$LIFF_ID@${{ vars.LIFF_ID }}@g' script.js
          sed -i 's@\$GAS_URL@${{ vars.GAS_URL }}@g' script.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4