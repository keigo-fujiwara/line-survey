name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHubのVariablesの値をindex.html内の文字と置き換えるステップ
      - name: Replace Environment Variables
        run: |
          sed -i 's|__LIFF_ID__|${{ vars.LIFF_ID }}|g' index.html
          sed -i 's|__GAS_URL__|${{ vars.GAS_URL }}|g' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4