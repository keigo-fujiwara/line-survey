name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 環境変数を明示的に渡して置換を実行
      - name: Replace Environment Variables
        env:
          LIFF_ID_VAL: ${{ vars.LIFF_ID }}
          GAS_URL_VAL: ${{ vars.GAS_URL }}
        run: |
          sed -i "s@__LIFF_ID__@${LIFF_ID_VAL}@g" script.js
          sed -i "s@__GAS_URL__@${GAS_URL_VAL}@g" script.js

      # 置換結果をログに出力して確認
      - name: Verify Replacement
        run: |
          echo "=== script.js Check ==="
          head -n 5 script.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4