name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 置換処理の区切り文字を @ に変更して確実に置換します
      - name: Replace Environment Variables
        run: |
          sed -i 's@__LIFF_ID__@${{ vars.LIFF_ID }}@g' script.js
          sed -i 's@__GAS_URL__@${{ vars.GAS_URL }}@g' script.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4