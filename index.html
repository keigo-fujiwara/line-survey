<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アンケート</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div id="status">読み込み中...</div>

    <!-- 同意・案内ステップ -->
    <div id="consent-step" style="display:none;">
      <h2 id="survey-title">サービス改善アンケート</h2>
      
      <div class="meta-box">
        <div class="meta-item"><span class="meta-label">実施期間：</span>2026年10月10日 〜 2026年10月31日</div>
        <div class="meta-item"><span class="meta-label">概要：</span>サービスの利便性向上のためのご意見を伺うアンケートです。</div>
      </div>

      <div class="notice-text">
        このアンケートは運営者が実施しています。アカウント運営者は個人を特定できない形で回答結果のみ確認します。
      </div>

      <button type="button" id="start-btn">同意して回答する</button>
    </div>

    <!-- フォーム入力ステップ -->
    <form id="survey-form" style="display:none;">
      <h2>アンケート回答</h2>

      <div class="field">
        <label for="satisfaction">満足度を教えてください</label>
        <select id="satisfaction" required>
          <option value="">選択してください</option>
          <option value="5">大変満足</option>
          <option value="4">満足</option>
          <option value="3">普通</option>
          <option value="2">やや不満</option>
          <option value="1">不満</option>
        </select>
      </div>

      <div class="field">
        <label for="feedback">ご意見・ご感想</label>
        <textarea id="feedback" rows="4" placeholder="ご自由にご記入ください"></textarea>
      </div>

      <button type="submit" id="submit-btn">送信する</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
